# PaperTrace stack — grows ticket by ticket (see SPEC.md §11).
# Live now: web, api, qdrant, postgres, grafana, prefect. Arriving later:
# langfuse profile (#8).
services:
  web:
    build: web
    ports:
      - "3000:3000"
    environment:
      PAPERTRACE_API_URL: http://api:8000
    depends_on:
      - api

  prefect:
    image: prefecthq/prefect:3.8.2-python3.12  # keep in step with prefect in pyproject
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    volumes:
      - prefect_data:/root/.prefect

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PAPERTRACE_QDRANT_URL: http://qdrant:6333
      PREFECT_API_URL: http://prefect:4200/api  # in-container flow runs show in the UI
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - hf_cache:/data/hf-cache
    depends_on:
      - qdrant
  qdrant:
    image: qdrant/qdrant:v1.19.0  # keep in step with qdrant-client in pyproject
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-papertrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-papertrace}
      POSTGRES_DB: ${POSTGRES_DB:-papertrace}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana-oss:11.2.0
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  qdrant_data:
  postgres_data:
  grafana_data:
  hf_cache:
  prefect_data:

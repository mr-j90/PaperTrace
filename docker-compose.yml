# PaperTrace stack — grows ticket by ticket (see SPEC.md §11).
# Live now: api, qdrant, postgres, grafana. Arriving later: prefect (#4),
# web (#7), langfuse profile (#8).
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PAPERTRACE_QDRANT_URL: http://qdrant:6333
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - hf_cache:/data/hf-cache
    depends_on:
      - qdrant
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-papertrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-papertrace}
      POSTGRES_DB: ${POSTGRES_DB:-papertrace}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana-oss:11.2.0
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  qdrant_data:
  postgres_data:
  grafana_data:
  hf_cache:

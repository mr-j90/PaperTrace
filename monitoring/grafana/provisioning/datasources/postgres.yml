apiVersion: 1

datasources:
  - name: PaperTrace Postgres
    uid: papertrace-pg
    type: postgres
    access: proxy
    url: postgres:5432
    user: papertrace
    jsonData:
      database: papertrace
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $POSTGRES_PASSWORD
    isDefault: true
    editable: false

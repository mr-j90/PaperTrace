[project]
name = "papertrace"
version = "0.1.0"
description = "Agentic RAG assistant over the RAG/agents/eval/LLMOps slice of arXiv"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "data", ".scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["core", "api", "ingest", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
